name: Test Backend

on:
  pull_request:
    branches: [main]
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      # `deno test` never type-checks entrypoints — nothing imports index.ts, and
      # a type error there reached production (DEX-84). Each has its own deno.json.
      - name: Type check function entrypoints
        run: |
          for dir in functions/*/; do
            name=$(basename "$dir")
            [ -f "$dir/deno.json" ] || continue
            echo "==> $name"
            deno check --config "$dir/deno.json" "$dir/index.ts"
          done

      - name: Test
        run: deno test --allow-all --config __tests__/deno.json __tests__/
