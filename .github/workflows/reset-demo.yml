name: Reset Demo Account

# Reseeds the demo account daily (DEX-117). The hour is load-bearing:
# seed-demo derives "today" in UTC, so an overnight slot seeds tomorrow's dates.

on:
  schedule:
    # 12:00 UTC = 08:00 EDT. GitHub cron has no DST support, so the winter hour
    # of drift is accepted rather than gated with a second cron.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Reset production demo account
    runs-on: ubuntu-latest
    # Not deploy.yml's group — GitHub keeps one pending run per group, so a
    # deploy would evict a queued reseed. No cancel: never kill one half-wiped.
    concurrency:
      group: reset-demo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch production service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        # seed-demo bypasses RLS via the Auth Admin API; fetching the
        # service-role key from the Management API keeps it out of repo secrets.
        run: |
          set -euo pipefail
          # Captured, never echoed — reveal=true returns the key material in full.
          keys=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          # Legacy service_role JWT first, else a new-style sb_secret_ key;
          # `.api_key` is null-guarded before startswith, which errors on null.
          key=$(echo "$keys" | jq -r '
            [.[] | select(.api_key != null)] as $present
            | ([$present[] | select(.name == "service_role")][0].api_key
               // [$present[] | select(.api_key | startswith("sb_secret_"))][0].api_key
               // empty)')
          if [ -z "$key" ]; then
            echo "::error::No service-role key for production project $PROJECT_REF."
            # Names only — safe to log, and enough to spot a changed payload shape.
            echo "Keys returned: $(echo "$keys" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Reset demo account
        working-directory: supabase/scripts
        env:
          # .env.preview deliberately carries *production's* DEMO_OTP — "rotate
          # together", docs/backend.md — so one encrypted file seeds both.
          DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
          # The project's own supabase.co host, derived from the same ref the
          # key was fetched for — URL and credential can't point at different projects.
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
        # Pinned: this decrypts a production credential. `--strict` is load-bearing —
        # without it a failed decrypt still runs with ciphertext as DEMO_OTP, job green.
        run: npx --yes @dotenvx/dotenvx@2.18.1 run --strict -f ../.env.preview -- deno task seed-demo
