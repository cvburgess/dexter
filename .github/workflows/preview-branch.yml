name: Preview Branch

# Fills gaps Supabase branching leaves: functions aren't reliably redeployed
# on later pushes, and no demo user is seeded. See docs/backend.md.

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      git_branch:
        description: 'PR head branch to target (defaults to current ref)'
        required: false

permissions:
  contents: read

# Every check_run:completed event joins a group before the `if` runs, so keying
# on PR number alone lets unrelated checks cancel a deploy — include the name.
concurrency:
  group: preview-branch-${{ github.event.check_run.name || 'dispatch' }}-${{ github.event.check_run.pull_requests[0].number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve preview branch
    runs-on: ubuntu-latest
    # Only run after Supabase confirms the preview branch is ready, or
    # on explicit manual dispatch.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'supabase' &&
       github.event.check_run.name == 'Supabase Preview' &&
       github.event.check_run.conclusion == 'success')
    outputs:
      ref: ${{ steps.branch.outputs.ref }}
    steps:
      # Pure Management API call — no checkout or CLI needed here.
      - name: Resolve preview branch project_ref
        id: branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PARENT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          # On check_run events github.ref_name is the repo default branch, not
          # the PR head — prefer the PR head ref, then the suite's head branch.
          GIT_BRANCH: ${{ github.event.check_run.pull_requests[0].head.ref || github.event.check_run.check_suite.head_branch || inputs.git_branch || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Resolving preview branch for git_branch=$GIT_BRANCH under parent=$PARENT_REF..."
          response=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$PARENT_REF/branches")
          ref=$(echo "$response" | jq -r \
            --arg b "$GIT_BRANCH" \
            '[.[] | select(.git_branch == $b)][0].project_ref // empty')
          if [ -z "$ref" ]; then
            echo "::error::No Supabase preview branch found for git_branch=$GIT_BRANCH after Supabase Preview check success."
            exit 1
          fi
          echo "Resolved preview branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  deploy-functions:
    name: Deploy edge functions to preview branch
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # check_run events point GITHUB_SHA/REF at the default branch — pin
      # checkout to the PR head (or dispatched branch) so its code deploys.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.git_branch || github.ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions to preview branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The CLI upserts by name, so re-running on subsequent pushes is
        # idempotent and overwrites prior versions.
        run: supabase functions deploy --project-ref ${{ needs.resolve.outputs.ref }}

  seed-demo:
    name: Seed demo account on preview branch
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # Same pinning rationale as deploy-functions: seed from the PR's
      # demoData.ts, not main's.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.git_branch || github.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch preview branch service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_REF: ${{ needs.resolve.outputs.ref }}
        # seed-demo bypasses RLS, and preview branches mint their own
        # service-role key — the parent project's is not valid against them.
        run: |
          set -euo pipefail
          # Captured, never echoed — reveal=true returns the key material in full.
          keys=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$PREVIEW_REF/api-keys?reveal=true")
          # Legacy service_role JWT first, else a new-style sb_secret_ key;
          # `.api_key` is null-guarded before startswith, which errors on null.
          key=$(echo "$keys" | jq -r '
            [.[] | select(.api_key != null)] as $present
            | ([$present[] | select(.name == "service_role")][0].api_key
               // [$present[] | select(.api_key | startswith("sb_secret_"))][0].api_key
               // empty)')
          if [ -z "$key" ]; then
            echo "::error::No service-role key for preview branch $PREVIEW_REF."
            # Names only — safe to log, and enough to spot a changed payload shape.
            echo "Keys returned: $(echo "$keys" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Seed demo account
        working-directory: supabase/scripts
        env:
          # The demo password derives from DEMO_OTP, which must match what
          # [edge_runtime.secrets] applies — sourcing both from .env.preview keeps them in sync.
          DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
          SUPABASE_URL: https://${{ needs.resolve.outputs.ref }}.supabase.co
        # Pinned: this decrypts a production credential. `--strict` is load-bearing —
        # without it a failed decrypt still runs with ciphertext as DEMO_OTP, job green.
        run: npx --yes @dotenvx/dotenvx@2.18.1 run --strict -f ../.env.preview -- deno task seed-demo
