# Open one screen (LINK/ANCHOR/ANCHOR_BY from a ../screens.tsv row, via
# capture.sh) and settle it for capture. Deep links, not taps — see ../README.md.
appId: com.dexterplanner
---
# Nothing ever dismisses the imperatively-presented task drawer, and iOS marks
# everything behind a sheet inaccessible — swipe it away (a tablet's docked pane isn't one).
- runFlow:
    when:
      true: ${DRAWER == "sheet"}
      visible:
        id: "drawer-controls"
    commands:
      - swipe:
          start: "50%,35%"
          end: "50%,95%"
      - extendedWaitUntil:
          notVisible:
            id: "drawer-controls"
          timeout: 10000

- openLink: ${LINK}

# iOS 26 confirms custom-scheme links from `simctl openurl` with a springboard
# alert. Guarded on its title — a bare optional "Open" regex could match in-app text.
- runFlow:
    when:
      visible: "Open in .Dexter.*"
    commands:
      - tapOn: "^Open$"

# The anchor wait runs twice around an AlarmKit check: the prompt (see
# login.yaml) can land seconds after navigation, over the anchor, mid-wait.
- runFlow:
    when:
      true: ${ANCHOR_BY == "id"}
    commands:
      - extendedWaitUntil:
          visible:
            id: ${ANCHOR}
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: ".*schedule alarms and timers.*"
          commands:
            - tapOn: "^Allow$"
      - extendedWaitUntil:
          visible:
            id: ${ANCHOR}
          timeout: 30000

- runFlow:
    when:
      true: ${ANCHOR_BY == "text"}
    commands:
      - extendedWaitUntil:
          visible:
            text: ${ANCHOR}
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: ".*schedule alarms and timers.*"
          commands:
            - tapOn: "^Allow$"
      - extendedWaitUntil:
          visible:
            text: ${ANCHOR}
          timeout: 30000

# Maestro's settle heuristics cover taps, not the frame after a cross-tab
# navigation — let animations and lazy list work finish first.
- waitForAnimationToEnd:
    timeout: 5000
