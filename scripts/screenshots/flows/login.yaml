# Sign the demo account in. The OTP arrives as MAESTRO_DEMO_OTP, never in argv
# where `ps` could read it; selectors are id: — text: compiles to a regex (../README.md).
appId: com.dexterplanner
---
# clearState so a rerun never inherits a half-finished login, and so the capture
# set is identical whether or not the app was already installed.
- launchApp:
    clearState: true
    permissions:
      all: allow

# A springboard alert outlives `clearState`, so a dead run's "Open in Dexter?"
# prompt sits over login. Cancel — the stale link is not one we want.
- runFlow:
    when:
      visible: "Open in .Dexter.*"
    commands:
      - tapOn: "^Cancel$"

# AlarmKit has no simctl privacy service, so its dialog must be tapped away.
# It can land at launch (iPad) or a beat after login (iPhone) — wait, not poll.
- extendedWaitUntil:
    visible: ".*schedule alarms and timers.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*schedule alarms and timers.*"
    commands:
      - tapOn: "^Allow$"

# Bracketed like goto.yaml's anchor wait: the AlarmKit prompt can land over
# the login screen after the guard above has already given up on it.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*schedule alarms and timers.*"
    commands:
      - tapOn: "^Allow$"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 30000
- tapOn:
    id: "login-email-input"
- inputText: "demo@dexterplanner.com"
# `hideKeyboard` does not work against these inputs (the app's own TextInput,
# not a system one). Tapping the static subtitle dismisses the keyboard instead.
- tapOn:
    text: "Sign up or log in to start planning"
    optional: true
- tapOn:
    id: "login-email-button"

- extendedWaitUntil:
    visible:
      id: "login-code-input"
    timeout: 30000
- tapOn:
    id: "login-code-input"
- inputText: ${MAESTRO_DEMO_OTP}
- tapOn:
    id: "login-verify-button"

# The login screen unmounting is the signal that setSession landed.
- extendedWaitUntil:
    notVisible:
      id: "login-verify-button"
    timeout: 30000

# The AlarmKit prompt fires a beat after login, when the first alarm-bearing
# task loads — wait it out here or it sits over a capture and fails the anchor.
- extendedWaitUntil:
    visible: ".*schedule alarms and timers.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*schedule alarms and timers.*"
    commands:
      - tapOn: "^Allow$"
